name: ATHAR deep audit tools

on:
  pull_request:
    paths:
      - ".gitmodules"
      - "tools/**"
      - ".codex/skills/codebase-audit/**"
      - ".codex/skills/tardigrade-audit/**"
      - "docs/AUDIT_TOOLING.md"
      - ".github/workflows/deep-audit-tools.yml"
      - "AGENTS.md"
  workflow_dispatch:

jobs:
  validate-audit-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ATHAR
        uses: actions/checkout@v4

      - name: Fetch pinned audit tools outside ATHAR runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/kevinpatrickrobbins/codebase-audit.git "$RUNNER_TEMP/codebase-audit"
          git -C "$RUNNER_TEMP/codebase-audit" checkout -q 16db555ea2c0282eb965343f109c037aeabe4d54
          git clone -q https://github.com/noemit/tardigrade.git "$RUNNER_TEMP/tardigrade"
          git -C "$RUNNER_TEMP/tardigrade" checkout -q 9f46c0663a9d5b28cfabe0f71e74a516b60d85f7
          echo "Pinned audit tools fetched outside application source tree"

      - name: Apply pinned Tardigrade compatibility shims
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("/home/runner/work/_temp/tardigrade")

          llm = root / "packages/backend/src/agent/llm.ts"
          text = llm.read_text()
          old = '''      type: "scroll",
      direction: "down",
      reasoning: "Mock: scroll down to see more content",'''
          new = '''      type: "scroll",
      deltaX: 0,
      deltaY: 600,
      reasoning: "Mock: scroll down to see more content",'''
          if old not in text:
              raise SystemExit("Pinned Tardigrade mock signature changed; refusing silent patch")
          llm.write_text(text.replace(old, new, 1))

          example = root / "packages/backend/scripts/run-example.ts"
          text = example.read_text()
          old_import = 'import { scoreRun } from "../src/evaluator/scorer.js";'
          new_import = 'import { evaluateRun } from "../src/evaluator/taskEvaluator.js";'
          old_call = '''    await scoreRun(runId, rubricSetId);
    console.log("Scoring complete.");'''
          new_call = '''    const evaluation = await evaluateRun(runId);
    console.log(`Evaluation complete: ${evaluation.summary}`);'''
          if old_import not in text or old_call not in text:
              raise SystemExit("Pinned Tardigrade example CLI changed; refusing silent patch")
          text = text.replace(old_import, new_import, 1).replace(old_call, new_call, 1)
          example.write_text(text)

          print("Tardigrade shims applied: mock scroll + current task evaluator")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify codebase-audit integration
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/codebase-audit/workflows/kpr/gap-analysis.md"
          test -f "$RUNNER_TEMP/codebase-audit/workflows/kpr/persistence-gap-analysis.md"
          test -f "$RUNNER_TEMP/codebase-audit/workflows/kpr/qa-test-part-1-planning.md"
          test -f "$RUNNER_TEMP/codebase-audit/workflows/kpr/qa-test-part-2-execution.md"
          echo "codebase-audit pinned integration: OK"

      - name: Install and verify ATHAR
        run: |
          npm install
          npm test
          npm run build

      - name: Start ATHAR
        shell: bash
        run: |
          nohup npm start > /tmp/athar.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              echo "ATHAR ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/athar.log
          exit 1

      - name: Install Tardigrade
        shell: bash
        run: |
          cd "$RUNNER_TEMP/tardigrade"
          npm install

      - name: Typecheck Tardigrade
        shell: bash
        run: |
          cd "$RUNNER_TEMP/tardigrade"
          npm run typecheck

      - name: Install Chromium for Tardigrade
        shell: bash
        run: |
          cd "$RUNNER_TEMP/tardigrade"
          npx playwright install --with-deps chromium

      - name: Run Tardigrade synthetic-user smoke audit
        env:
          MOCK_LLM: "true"
        shell: bash
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/tardigrade"
          npm run example --workspace=packages/backend -- http://127.0.0.1:3000 default 2>&1 | tee "$GITHUB_WORKSPACE/tardigrade-athar-smoke.log"
          grep -q "Agent loop finished: success" "$GITHUB_WORKSPACE/tardigrade-athar-smoke.log"
          grep -q "Evaluation complete:" "$GITHUB_WORKSPACE/tardigrade-athar-smoke.log"
          grep -q "\[Mock\] Task evaluation" "$GITHUB_WORKSPACE/tardigrade-athar-smoke.log"

      - name: Save validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "ATHAR audit tooling validation"
            echo "codebase-audit: 16db555ea2c0282eb965343f109c037aeabe4d54"
            echo "tardigrade: 9f46c0663a9d5b28cfabe0f71e74a516b60d85f7"
            echo "Tardigrade compatibility shims: mock scroll schema + example CLI uses current evaluateRun path"
            echo "ATHAR server log follows"
            cat /tmp/athar.log 2>/dev/null || true
          } > audit-tooling-validation.txt

      - name: Upload audit validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athar-audit-tooling-validation
          path: |
            audit-tooling-validation.txt
            tardigrade-athar-smoke.log
          if-no-files-found: warn
          retention-days: 7
