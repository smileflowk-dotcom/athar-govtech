name: ATHAR check

on:
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next-env.d.ts"
      - "next.config.ts"
      - ".github/workflows/ui-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

      - name: Install web-uplift for Codex
        run: npx -y web-uplift@latest install --agent codex

      - name: Start ATHAR locally
        run: |
          nohup npm start > /tmp/athar.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              echo "ATHAR is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/athar.log
          exit 1

      - name: Collect web-uplift evidence
        shell: bash
        run: |
          set +e
          mkdir -p web-uplift-evidence
          CLI="node .web-uplift/evidence/cli.mjs"
          URL="http://127.0.0.1:3000"

          $CLI screenshot "$URL" --viewport 1440x1000 --out web-uplift-evidence/home-desktop.png 2>&1 | tee web-uplift-evidence/screenshot-desktop.log
          $CLI screenshot "$URL" --viewport 390x844 --out web-uplift-evidence/home-mobile.png 2>&1 | tee web-uplift-evidence/screenshot-mobile.log
          $CLI layout "$URL" --viewport 1440x1000 --out web-uplift-evidence/layout-desktop.json 2>&1 | tee web-uplift-evidence/layout-desktop.log
          $CLI layout "$URL" --viewport 390x844 --out web-uplift-evidence/layout-mobile.json 2>&1 | tee web-uplift-evidence/layout-mobile.log
          $CLI dom "$URL" --source . --out web-uplift-evidence/dom.json 2>&1 | tee web-uplift-evidence/dom.log
          $CLI discoverability "$URL" --out web-uplift-evidence/discoverability 2>&1 | tee web-uplift-evidence/discoverability.log
          $CLI headers "$URL" --out web-uplift-evidence/headers.json 2>&1 | tee web-uplift-evidence/headers.log
          $CLI cookies "$URL" --out web-uplift-evidence/cookies.json 2>&1 | tee web-uplift-evidence/cookies.log
          $CLI trackers "$URL" --out web-uplift-evidence/trackers.json 2>&1 | tee web-uplift-evidence/trackers.log
          $CLI images "$URL" --out web-uplift-evidence/images.json 2>&1 | tee web-uplift-evidence/images.log
          $CLI secrets "$URL" --out web-uplift-evidence/secrets.json 2>&1 | tee web-uplift-evidence/secrets.log
          $CLI trace "$URL" --out web-uplift-evidence/trace 2>&1 | tee web-uplift-evidence/trace.log

          echo "--- ATHAR server log ---" > web-uplift-evidence/athar-server.log
          cat /tmp/athar.log >> web-uplift-evidence/athar-server.log
          cp .web-uplift/manifest.json web-uplift-evidence/manifest.json || true
          find web-uplift-evidence -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Persist web-uplift installation on audit branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .web-uplift .codex AGENTS.md
          if git diff --cached --quiet; then
            echo "web-uplift already installed"
          else
            git commit -m "chore: install web-uplift"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload web-uplift evidence
        uses: actions/upload-artifact@v4
        with:
          name: athar-web-uplift-evidence
          path: web-uplift-evidence/
          if-no-files-found: error
          retention-days: 7
