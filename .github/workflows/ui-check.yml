name: UI check

on:
  pull_request:
    paths:
      - "app/**"
      - "package.json"
      - "tsconfig.json"
      - "next-env.d.ts"
      - ".github/workflows/ui-check.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
