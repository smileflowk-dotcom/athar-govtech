services:
  gateway:
    image: athar-govtech-gateway:local
    build:
      context: ./docker/gateway
      dockerfile: Dockerfile
    environment:
      GATEWAY_PORT: 8080
      ATHAR_UPSTREAM_HOST: athar
      ATHAR_UPSTREAM_PORT: 3000
    ports:
      - "127.0.0.1:${ATHAR_PORT:-3000}:8080"
    # Ce relais ne stocke ni n'analyse les documents : il diffuse le flux HTTP vers
    # le conteneur ATHAR. Seul ATHAR contient l'extraction PDF et le moteur de règles.
    networks:
      - athar_internal
      - athar_ingress
    depends_on:
      athar:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

  athar:
    image: athar-govtech-poc:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: 3000
      ATHAR_DATA_DIR: ${ATHAR_DATA_DIR:-/data}
      ATHAR_DOCLING_URL: ${ATHAR_DOCLING_URL:-}
    volumes:
      - athar_data:${ATHAR_DATA_DIR:-/data}
    # ATHAR reçoit/traite les documents et exécute les règles. Il est uniquement
    # rattaché à ce réseau `internal: true` : aucune route Internet sortante.
    networks:
      - athar_internal
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  # Moteur documentaire local optionnel. Il n'est lancé que lorsque le profil
  # `enhanced-docs` est demandé. L'image officielle expose l'API sur le port 5001.
  docling:
    profiles: ["enhanced-docs"]
    image: quay.io/docling-project/docling-serve
    environment:
      DOCLING_SERVE_ENABLE_UI: "0"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "false"
    networks:
      - athar_internal
    volumes:
      - docling_cache:/root/.cache
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  athar_internal:
    name: athar_govtech_internal
    internal: true
  athar_ingress:
    name: athar_govtech_ingress

volumes:
  athar_data:
    name: athar_govtech_data
  docling_cache:
    name: athar_docling_cache
