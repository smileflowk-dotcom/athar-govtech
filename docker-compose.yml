services:
  athar:
    image: athar-govtech-poc:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: ${ATHAR_PORT:-3000}
      ATHAR_DATA_DIR: ${ATHAR_DATA_DIR:-/data}
    ports:
      - "127.0.0.1:${ATHAR_PORT:-3000}:${ATHAR_PORT:-3000}"
    volumes:
      - athar_data:${ATHAR_DATA_DIR:-/data}
    # Le conteneur ATHAR traite les documents et exécute les règles. Il n'est donc
    # rattaché qu'à un réseau Docker `internal: true`, sans route Internet sortante.
    # Le port publié sur 127.0.0.1 reste accessible uniquement depuis la machine hôte.
    networks:
      - athar_internal
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

networks:
  athar_internal:
    internal: true

volumes:
  athar_data:
    name: athar_govtech_data
